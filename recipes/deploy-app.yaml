  6.2. Append failed JSON to `{{ history_path }}`:

  ```json
  {"ts":"<iso8601>","git_sha":"<sha>","env":"{{ env }}","region":"{{ region }}",
   "attempts":<N>,"prefixes":<M>,"result":"failed","category":"<from above>",
   "exhausted_categories":["<cat1>","<cat2>"],"last_error":"<short>"}
  ```

  6.3. Print one terminal line and stop:
  `APP DEPLOY FAILED after <N> attempts — see {{ failure_report_path }}`

  ## Constraints

  ### ALLOWED
  - `docker build`, `docker push`, `docker pull`
  - `aws ecr *` (read + push)
  - `aws ecs register-task-definition`, `update-service`, `wait`,
    `describe-*`, `list-*`, `execute-command`
  - `aws elbv2 modify-target-group`, `describe-target-health`,
    `describe-target-groups`
  - `aws secretsmanager create-secret`, `put-secret-value`,
    `describe-secret`, `get-secret-value`, `list-secrets`
  - `aws logs tail`, `get-log-events`, `describe-log-streams`,
    `describe-log-groups`
  - `aws cloudwatch get-metric-statistics`
  - Reading any file under `{{ source_path }}` (Phase 1.5)
  - Writing to `{{ attempts_path }}`, `{{ failure_report_path }}`,
    `{{ history_path }}`
  - Creating a *new* `Dockerfile.deploy` next to an upstream Dockerfile.
    Never modify upstream files in place.

  ### FORBIDDEN
  - Modifying anything under `{{ iac_dir }}/` (IaC is regenerated by
    `generate-iac`, not edited at deploy time).
  - `aws iam *` create/update/delete (security boundary).
  - `aws ec2 *`, `aws rds modify-*`, `aws elasticache modify-*`,
    `aws elbv2 create-*`/`delete-*` (resource shape).
  - Any `aws *-delete-*` command.
  - Editing application source code beyond a freshly-created `Dockerfile.deploy`.
  - Running more than 3 attempts in the same category.
  - Running more than 8 attempts total.
  - Applying any fix not in the Phase 4.2 whitelist.
  - Pushing the `latest` tag.
  - Output language other than English.

  ### LOOP DISCIPLINE
  - One fix per attempt.
  - Pre-fixes (Phase 1.7) come BEFORE attempts and don't count toward 4.0
    budget. They do count in the access summary.
  - After 3 attempts in same category with no progress → category
    exhausted; either pivot to a different category if a new symptom
    appears, or Phase 6.
  - Always build for `linux/amd64`.

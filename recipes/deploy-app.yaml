  ## Status
  STOPPED after <N> self-heal attempts (<M> pre-fixes).

  ## What was tried
  **Pre-fixes (Phase 1.7):** <copy from attempts.md pre-fix entries>
  **Self-heal attempts:** <copy each attempt's Category + Fix applied + Result>

  ## Categories exhausted
  - <category>: 3/3 (rows tried, all failed)
  - ...

  ## Root cause
  <plain-English paragraph; if unknown say so>

  ## Categorization (pick one)
  - Missing dependency service (skeleton needs e.g. Typesense, Elasticsearch, Kafka)
  - Missing external SaaS account (real Stripe/Sendgrid/OpenAI key required)
  - Architectural incompatibility (k8s feature, GPU, Windows containers)
  - Scale beyond skeleton (needs RDS r6g.xlarge, multi-AZ ECS, etc.)
  - Upstream code bug (app crashes regardless of infra)
  - Requires infrastructure change (fix lives in IaC, not deploy-app scope)
  - Ambiguous monorepo layout (operator must specify Dockerfile paths)
  - Missing infrastructure outputs (deploy-infra didn't produce expected keys)
  - Unrecognized failure (no whitelist match — needs framework extension)

  ## Recommended actions
  <concrete next steps; "create OpenSearch domain via console, then put OPENSEARCH_URL into Secrets Manager, then re-run deploy-app">

  ## Logs and resources
  - CloudWatch log groups: <list>
  - Last failed task ARNs: <list>
  - ALB DNS: <url>
  - ECR images pushed during this run: <list>
  - Secrets created during attempts/pre-fixes: <list — operator should review/rotate placeholders>
  - Approximate AWS cost so far: ~$<estimate>

  ## Operator next steps
  - Stop billing immediately:  `./devops-ai.sh destroy {{ repo_name }}`
  - Retry after fix:           `./devops-ai.sh deploy-app {{ repo_name }}`
  - Extend the framework:      see `docs/03_runbook.md`

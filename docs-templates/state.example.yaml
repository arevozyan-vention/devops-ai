# EXAMPLE state.yaml — reference only.
#
# Real state files live at projects/<repo>/state.yaml and are managed by the
# framework: created by `init`, updated after each successful command, never
# meant to be hand-edited under normal use.
#
# This file shows the schema and what values look like at different points in
# the workflow. Three snapshots are inlined as YAML documents so you can see
# how the file evolves.

---
# ---------- Snapshot 1: right after `init` ----------
# Command:
#   ./devops-ai.sh init ~/code/super-api
#
# All status flags are false. region / env / infra_option are empty strings.
# `deploys` is an empty list — nothing has been deployed yet.

repo: super-api
source_path: /Users/operator/code/super-api      # absolute path to actual code
created_at: 2026-04-27T19:30:00Z
region: ""
env: ""
infra_option: ""
status:
  analyzed:        false
  recommended:     false
  selected:        false
  iac_generated:   false
  infra_deployed:  false
  app_deployed:    false
deploys: []

---
# ---------- Snapshot 2: after `select` ----------
# Commands run so far:
#   init, analyze, recommend, select
#
# region / env / infra_option are now populated. iac_generated still false
# because the skeleton hasn't been rendered + AI-finished yet.

repo: super-api
source_path: /Users/operator/code/super-api
created_at: 2026-04-27T19:30:00Z
account_id: "123456789012"                       # set by `select --account-id=...`
region: us-east-1
env: dev
infra_option: ecs-fargate-rds
status:
  analyzed:        true
  recommended:     true
  selected:        true
  iac_generated:   false
  infra_deployed:  false
  app_deployed:    false
deploys: []

---
# ---------- Snapshot 3: after one successful `deploy-app` ----------
# Commands run so far:
#   init, analyze, recommend, select, generate-iac, deploy-infra, deploy-app
#
# Every status flag is true. The deploys list has one record. Subsequent
# `deploy-app` / `upgrade` / `rollback` calls append more records here AND
# to projects/super-api/deploy/history.jsonl.

repo: super-api
source_path: /Users/operator/code/super-api
created_at: 2026-04-27T19:30:00Z
account_id: "123456789012"
region: us-east-1
env: dev
infra_option: ecs-fargate-rds
status:
  analyzed:        true
  recommended:     true
  selected:        true
  iac_generated:   true
  infra_deployed:  true
  app_deployed:    true
deploys:
  - ts: 2026-04-27T20:14:08Z
    git_sha: a1b2c3d4e5f6
    image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/super-api-dev:a1b2c3d4e5f6
    env: dev
    region: us-east-1
    result: success
    task_def_arn: arn:aws:ecs:us-east-1:123456789012:task-definition/super-api-dev:42
    details: "first deploy from main"

# ---------- Notes ----------
#
# • `status.*` is read by the CLI before each command. The next command in
#   the workflow is gated on the previous one being true. To override (e.g.
#   you ran terragrunt apply by hand and want to skip the deploy-infra
#   recipe), set the flag manually with yq:
#       yq eval -i '.status.infra_deployed = true' projects/<repo>/state.yaml
#
# • Secrets and AWS credentials are NEVER stored here. account_id is just
#   the 12-digit identifier; it's not sensitive on its own.
#
# • `source_path` is an absolute path. If you move the repo, fix it with:
#       yq eval -i '.source_path = "/new/path"' projects/<repo>/state.yaml
#
# • `deploys[]` is the last-N rolling history mirrored from
#   projects/<repo>/deploy/history.jsonl. The JSONL file is the canonical
#   append-only log; this YAML list is for quick `status` display.

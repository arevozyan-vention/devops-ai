# Goose recipe: self-review of generated IaC for security, cost, and policy.
# Runs AFTER generate-iac and BEFORE plan-infra. Produces a markdown report
# the operator can use to gate apply. Does NOT modify the IaC tree.
version: "1.0.0"
title: "Review generated IaC"
description: "Self-review of freshly generated Terragrunt IaC for security, cost, and policy issues."
# Tuned for Opus 4.7. Low-mid temp — the review needs reasoning, but findings
# should be reproducible. max_turns wide enough to walk the whole IaC tree.
temperature: 0.2
max_turns: 80
parameters:
  - key: repo_name
    input_type: string
    requirement: required
    description: "Project name (matches projects/<name>/)."
  - key: iac_dir
    input_type: string
    requirement: required
    description: "Absolute path to the rendered Terragrunt project."
  - key: overview_path
    input_type: string
    requirement: required
    description: "Path to docs/00_overview.md (application context)."
  - key: output_path
    input_type: string
    requirement: required
    description: "Absolute path to docs/01_review.md to write."
  - key: state_yaml
    input_type: string
    requirement: required
    description: "Absolute path to the project's state.yaml."
  - key: cloud
    input_type: string
    requirement: optional
    default: "aws"
    description: "Cloud the IaC targets: aws | azure (future: gcp). Drives which security/cost lenses apply."
extensions:
  - type: builtin
    name: developer
prompt: |
  You are a senior DevOps + security engineer doing a final review of
  freshly generated Terragrunt + Terraform IaC at {{ iac_dir }} BEFORE
  it is planned and applied. Your output is consumed by a human operator
  who will decide whether to proceed.

  ## Inputs

  - Cloud: **{{ cloud }}**
  - Application overview: {{ overview_path }}
  - IaC tree (read-only for review purposes): {{ iac_dir }}
  - Project state: {{ state_yaml }}
  - Report output: {{ output_path }}

  ## Goal

  Find issues that should block, slow, or shape the upcoming apply.
  Categorize by severity. Be concrete — cite file:line and quote the
  problematic lines verbatim. Ground-truth lookups depend on the cloud:
  - cloud=aws: `aws-api` MCP is on (use for IAM, Service Quotas, S3
    bucket collisions). `terraform` MCP for module docs.
  - cloud=azure: `aws-api` is off, only the developer MCP is available;
    use `az` CLI through Terminal for live checks (existing role
    assignments, name collisions, SKU availability in the region).
    `terraform` MCP for module docs.

  ## What to look for (not exhaustive)

  Common lenses:
  - **Correctness**: dangling `dependency` blocks, mismatched output
    references, hardcoded values that should pull from inputs.yaml,
    inconsistent tag schemes, missing `prevent_destroy` on stateful
    resources in prod.
  - **Drift risk**: data sources that depend on resources not yet
    created (greenfield apply will fail at plan-time), bootstrap
    chicken-and-egg loops.
  - **Cost**: oversized DB sizing for dev, HA / multi-AZ in dev, log
    retention beyond what overview justifies, NAT/egress endpoints
    that should be private.

  Cloud-specific lenses:

  cloud=aws:
  - **Security**: 0.0.0.0/0 in security groups, public S3 buckets,
    overly broad IAM policies (`*` actions or `*` resources beyond
    AWS Managed roles), secrets baked into HCL instead of Secrets
    Manager refs, plaintext passwords in inputs.yaml, missing
    encryption-at-rest, missing TLS, IMDSv1 enabled on EC2.
  - **Compliance**: missing backup/snapshot policies on RDS prod,
    missing CloudTrail / VPC Flow Logs if compliance is hinted at.

  cloud=azure:
  - **Security**: NSG inbound rules with `0.0.0.0/0` or
    `Internet → *` allow, Storage Account `allow_blob_public_access`
    or `shared_access_key_enabled` on (where avoidable), Key Vault
    public network access on with no firewall, role assignments
    using over-broad `Owner`/`Contributor` at subscription scope when
    a narrower scope works, secrets baked into HCL instead of Key
    Vault refs, ACR `admin_enabled=true`, Postgres
    `public_network_access_enabled=true`, missing TLS-1.2 enforcement.
  - **Compliance**: Postgres backup retention < 7 days,
    geo_redundant_backup off in prod, NSG flow logs off, Defender
    for Cloud disabled, untagged resources missing the standard
    project / environment / managedby / skeleton schema.

  ## Required output structure ({{ output_path }}, Markdown)

  ```
  # IaC Review — {{ repo_name }}

  ## Verdict
  [ ] Safe to plan/apply
  [ ] Needs changes (severity: high)
  [ ] Needs changes (severity: medium / low)

  ## High-severity findings (must fix before apply)
  - **<title>** — `<file>:<line>` — quote, why it matters, suggested fix.

  ## Medium-severity findings (should fix soon)
  - same shape

  ## Low-severity / informational
  - same shape

  ## Cost notes
  - rough monthly cost estimate, breakdown of biggest line items

  ## What looks good
  - things that are right (so the operator knows the review is honest,
    not just a list of complaints)
  ```

  ## Constraints

  - **Read-only**: do not modify any file under {{ iac_dir }}.
  - English only.
  - When done, print one line: `WROTE {{ output_path }}` and stop.
